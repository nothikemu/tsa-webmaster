<defs>
  <linearGradient id="eth-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="eth-body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#162a33"/>
    <stop offset="1" stop-color="#04090c"/>
  </linearGradient>
  <linearGradient id="eth-accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4de6ff"/>
    <stop offset=".6" stop-color="#4d84ff"/>
    <stop offset="1" stop-color="#8f6bff"/>
  </linearGradient>
  <linearGradient id="eth-spec" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="eth-shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
    <feOffset dy="10"/>
    <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="eth-clip"><polygon points="100,16 170,40 170,112 100,186 30,112 30,40"/></clipPath>
</defs>
<g filter="url(#eth-shadow)">
  <polygon points="100,8 180,36 180,116 100,196 20,116 20,36" fill="url(#eth-edge)"/>
  <polygon points="100,14 174,40 174,113 100,189 26,113 26,40" fill="url(#eth-body)"/>
  <polygon points="100,28 160,49 160,109 100,172 40,109 40,49" fill="none" stroke="url(#eth-accent)" stroke-width="1.5" opacity=".9"/>
  <polygon points="100,52 140,66 140,104 100,144 60,104 60,66" fill="url(#eth-accent)" opacity=".18"/>
  <polygon points="100,52 140,66 140,104 100,144 60,104 60,66" fill="none" stroke="url(#eth-accent)" stroke-width="2"/>
  <path d="M82 98 L96 112 L122 82" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 40 V50 M100 150 V160" stroke="#ffb14d" stroke-width="2.4" stroke-linecap="round"/>
  <g clip-path="url(#eth-clip)">
